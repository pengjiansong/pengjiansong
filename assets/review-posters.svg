<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="产品海报 · 主体与氛围结构复盘"><rect width="1200" height="820" fill="#f2f0e9"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="42" y="43" font-size="12" font-weight="400" fill="#b6432e">RETROSPECTIVE / STRUCTURE STUDY</text><text x="42" y="87" font-size="29" font-weight="500" fill="#25281f">产品海报 · 主体与氛围</text><text x="42" y="119" font-size="15" font-weight="400" fill="#707466">依据成稿后补绘制的结构示意，用于说明设计逻辑。</text><rect x="98" y="155" width="286" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="112" y="186" font-size="16" font-weight="400" fill="#25281f">唇膏 / 浓郁红</text><rect x="112" y="206" width="258" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="124" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="166" y="290" width="148" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="178" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M112,428h258" stroke="#8a1723" stroke-width="3"/><text x="112" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="458" y="155" width="286" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="472" y="186" font-size="16" font-weight="400" fill="#25281f">香氛 / 金色光影</text><rect x="472" y="206" width="258" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="484" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="526" y="290" width="148" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="538" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M472,428h258" stroke="#d5ad64" stroke-width="3"/><text x="472" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="818" y="155" width="286" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="832" y="186" font-size="16" font-weight="400" fill="#25281f">饮品 / 冰爽感</text><rect x="832" y="206" width="258" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="844" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="886" y="290" width="148" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="898" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M832,428h258" stroke="#e61d2b" stroke-width="3"/><text x="832" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#b6432e">01 / 视觉焦点</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">围绕唇膏、香水、饮品分别安排清晰的产品主体。</text><text x="42" y="659" font-size="17" font-weight="500" fill="#b6432e">02 / 氛围组织</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">以色彩与材质区分浓郁、温暖与冰爽的画面感受。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#b6432e">03 / 文字克制</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">标题与辅助说明围绕产品位置组织，控制阅读层级。</text><rect x="42" y="767" width="28" height="12" fill="#8a1723"/><rect x="77" y="767" width="28" height="12" fill="#d5ad64"/><rect x="112" y="767" width="28" height="12" fill="#e61d2b"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>