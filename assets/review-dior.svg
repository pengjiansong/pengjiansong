rect x="432" y="206" width="146" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="444" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="459" y="290" width="90" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="471" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M432,428h146" stroke="#850d19" stroke-width="3"/><text x="432" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="606" y="155" width="174" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="620" y="186" font-size="16" font-weight="400" fill="#25281f">04 / 高订包装</text><rect x="620" y="206" width="146" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="632" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="647" y="290" width="90" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="659" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M620,428h146" stroke="#850d19" stroke-width="3"/><text x="620" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="794" y="155" width="174" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="808" y="186" font-size="16" font-weight="400" fill="#25281f">05 / 上妆步骤</text><rect x="808" y="206" width="146" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="820" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="835" y="290" width="90" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="847" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M808,428h146" stroke="#850d19" stroke-width="3"/><text x="808" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="982" y="155" width="174" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="996" y="186" font-size="16" font-weight="400" fill="#25281f">06 / 产品信息</text><rect x="996" y="206" width="146" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="1008" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="1023" y="290" width="90" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="1035" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M996,428h146" stroke="#850d19" stroke-width="3"/><text x="996" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#850d19">01 / 阅读顺序</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">品牌识别 → 色号 → 质地 → 包装 → 上妆 → 产品信息</text><text x="42" y="659" font-size="17" font-weight="500" fill="#850d19">02 / 信息分工</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">一屏承担一个主要信息任务，让长页保持清晰节奏。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#850d19">03 / 视觉统一</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">以奶油白、深红与黑银产品建立整套页面的关联。</text><rect x="42" y="767" width="28" height="12" fill="#f4eee5"/><rect x="77" y="767" width="28" height="12" fill="#850d19"/><rect x="112" y="767" width="28" height="12" fill="#191616"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>