<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="主题展板 · 内容分区结构复盘"><rect width="1200" height="820" fill="#f2f0e9"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="42" y="43" font-size="12" font-weight="400" fill="#9b7845">RETROSPECTIVE / STRUCTURE STUDY</text><text x="42" y="87" font-size="29" font-weight="500" fill="#25281f">主题展板 · 内容分区</text><text x="42" y="119" font-size="15" font-weight="400" fill="#707466">依据成稿后补绘制的结构示意，用于说明设计逻辑。</text><rect x="42" y="155" width="440" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><rect x="58" y="171" width="408" height="77" rx="4" fill="#d8ceb3" stroke="#b9bcaf"/><text x="70" y="196" font-size="19" font-weight="400" fill="#25281f">主题标题 / 主视觉</text><rect x="58" y="264" width="225" height="192" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="70" y="289" font-size="18" font-weight="400" fill="#25281f">图像展示</text><rect x="299" y="264" width="167" height="85" rx="4" fill="#e7e5dd" stroke="#b9bcaf"/><text x="311" y="289" font-size="16" font-weight="400" fill="#25281f">文字说明</text><rect x="299" y="365" width="167" height="91" rx="4" fill="#e7e5dd" stroke="#b9bcaf"/><text x="311" y="390" font-size="16" font-weight="400" fill="#25281f">延展内容</text><text x="540" y="222" font-size="24" font-weight="400" fill="#25281f">顶部建立主题与文化意象。</text><text x="540" y="283" font-size="22" font-weight="400" fill="#707466">中部通过网格整合图像与文字。</text><text x="540" y="344" font-size="22" font-weight="400" fill="#707466">细节区补充内容与视觉延展。</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#9b7845">01 / 主题建立</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">顶部用山海异兽主题与主视觉形成整体识别。</text><text x="42" y="659" font-size="17" font-weight="500" fill="#9b7845">02 / 图文组织</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">通过分区排列图像、文字说明与延展内容。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#9b7845">03 / 阅读关系</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">建立主视觉、核心内容与补充细节的层级。</text><rect x="42" y="767" width="28" height="12" fill="#cfb877"/><rect x="77" y="767" width="28" height="12" fill="#273b4c"/><rect x="112" y="767" width="28" height="12" fill="#eee7d3"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>