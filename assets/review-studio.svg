<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="招生宣传 · 信息编排结构复盘"><rect width="1200" height="820" fill="#f2f0e9"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="42" y="43" font-size="12" font-weight="400" fill="#bc816a">RETROSPECTIVE / STRUCTURE STUDY</text><text x="42" y="87" font-size="29" font-weight="500" fill="#25281f">招生宣传 · 信息编排</text><text x="42" y="119" font-size="15" font-weight="400" fill="#707466">依据成稿后补绘制的结构示意，用于说明设计逻辑。</text><rect x="42" y="155" width="383" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><rect x="62" y="174" width="343" height="53" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="74" y="199" font-size="16" font-weight="400" fill="#25281f">工作室名称 / 主标题</text><rect x="62" y="242" width="343" height="69" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="74" y="267" font-size="16" font-weight="400" fill="#25281f">插画与主题氛围</text><rect x="62" y="326" width="343" height="50" rx="4" fill="#f0dcd3" stroke="#b9bcaf"/><text x="74" y="351" font-size="16" font-weight="400" fill="#25281f">体验课程 / 核心信息</text><rect x="62" y="390" width="343" height="48" rx="4" fill="#cddfe0" stroke="#b9bcaf"/><text x="74" y="415" font-size="16" font-weight="400" fill="#25281f">课程分区 / 价格与说明</text><rect x="62" y="451" width="343" height="24" rx="4" fill="#e7e5dd" stroke="#b9bcaf"/><text x="74" y="467" font-size="13" font-weight="400" fill="#25281f">报名与联系入口</text><text x="488" y="220" font-size="24" font-weight="400" fill="#25281f">阅读从主题识别进入具体课程。</text><text x="488" y="279" font-size="22" font-weight="400" fill="#707466">用色块区分课程与价格层级。</text><text x="488" y="337" font-size="22" font-weight="400" fill="#707466">将行动入口保留在页面底部。</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#bc816a">01 / 首层识别</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">工作室名称与插画区先建立主题与亲和感。</text><text x="42" y="659" font-size="17" font-weight="500" fill="#bc816a">02 / 课程组织</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">体验课程、课程价格与说明以独立区块集中呈现。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#bc816a">03 / 报名入口</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">底部保留联系与报名区域，形成明确的阅读终点。</text><rect x="42" y="767" width="28" height="12" fill="#fff5df"/><rect x="77" y="767" width="28" height="12" fill="#eac9bc"/><rect x="112" y="767" width="28" height="12" fill="#aed6db"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>