<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="产品画册 · 图文节奏结构复盘"><rect width="1200" height="820" fill="#f2f0e9"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="42" y="43" font-size="12" font-weight="400" fill="#850d19">RETROSPECTIVE / STRUCTURE STUDY</text><text x="42" y="87" font-size="29" font-weight="500" fill="#25281f">产品画册 · 图文节奏</text><text x="42" y="119" font-size="15" font-weight="400" fill="#707466">依据成稿后补绘制的结构示意，用于说明设计逻辑。</text><rect x="42" y="155" width="354" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="54" y="180" font-size="19" font-weight="400" fill="#25281f">识别与主题</text><rect x="64" y="215" width="310" height="148" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="76" y="240" font-size="19" font-weight="400" fill="#25281f">核心视觉</text><path d="M64,408h220" stroke="#850d19" stroke-width="3"/><path d="M64,435h285" stroke="#b5b6aa" stroke-width="3"/><rect x="422" y="155" width="354" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="434" y="180" font-size="19" font-weight="400" fill="#25281f">图文层级</text><rect x="444" y="215" width="143" height="221" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="456" y="240" font-size="18" font-weight="400" fill="#25281f">图像区</text><rect x="606" y="215" width="145" height="75" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="618" y="240" font-size="16" font-weight="400" fill="#25281f">标题</text><path d="M606,335h130" stroke="#b5b6aa" stroke-width="3"/><path d="M606,366h110" stroke="#b5b6aa" stroke-width="3"/><path d="M606,397h130" stroke="#b5b6aa" stroke-width="3"/><rect x="802" y="155" width="354" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="814" y="180" font-size="19" font-weight="400" fill="#25281f">延展应用</text><rect x="824" y="215" width="310" height="70" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="836" y="240" font-size="16" font-weight="400" fill="#25281f">横向应用</text><rect x="824" y="309" width="143" height="144" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="836" y="334" font-size="16" font-weight="400" fill="#25281f">竖向应用</text><rect x="987" y="309" width="147" height="144" rx="4" fill="#e7e5dd" stroke="#b9bcaf"/><text x="999" y="334" font-size="16" font-weight="400" fill="#25281f">配套说明</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#850d19">01 / 内容结构</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">以目录串联产品、色彩、质地、细节和使用说明。</text><text x="42" y="659" font-size="17" font-weight="500" fill="#850d19">02 / 版式节奏</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">产品大图与说明页面交替，建立翻阅中的疏密变化。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#850d19">03 / 一致性</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">重复使用页码、细线、标题样式与留白规则。</text><rect x="42" y="767" width="28" height="12" fill="#eee8dc"/><rect x="77" y="767" width="28" height="12" fill="#850d19"/><rect x="112" y="767" width="28" height="12" fill="#1b1716"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>