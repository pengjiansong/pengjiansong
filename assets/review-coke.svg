<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="活动视觉 · 多尺寸延展结构复盘"><rect width="1200" height="820" fill="#f2f0e9"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="42" y="43" font-size="12" font-weight="400" fill="#e61d2b">RETROSPECTIVE / STRUCTURE STUDY</text><text x="42" y="87" font-size="29" font-weight="500" fill="#25281f">活动视觉 · 多尺寸延展</text><text x="42" y="119" font-size="15" font-weight="400" fill="#707466">依据成稿后补绘制的结构示意，用于说明设计逻辑。</text><rect x="42" y="155" width="220" height="338" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="56" y="186" font-size="16" font-weight="400" fill="#25281f">主海报</text><rect x="56" y="206" width="192" height="43" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="68" y="231" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="94" y="290" width="114" height="108" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="106" y="315" font-size="14" font-weight="400" fill="#25281f">视觉主体</text><path d="M56,428h192" stroke="#e61d2b" stroke-width="3"/><text x="56" y="458" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="292" y="155" width="850" height="106" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="304" y="180" font-size="20" font-weight="400" fill="#25281f">横版：标题 / 城市空间 / 产品主体</text><rect x="292" y="281" width="153" height="238" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="306" y="312" font-size="16" font-weight="400" fill="#25281f">手机图</text><rect x="306" y="332" width="125" height="30" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="318" y="354" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="328" y="376" width="79" height="76" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="340" y="401" font-size="13.75" font-weight="400" fill="#25281f">视觉主体</text><path d="M306,454h125" stroke="#e61d2b" stroke-width="3"/><text x="306" y="484" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="475" y="281" width="126" height="238" rx="4" fill="#f6f4ed" stroke="#b9bcaf"/><text x="489" y="312" font-size="16" font-weight="400" fill="#25281f">展架</text><rect x="489" y="332" width="98" height="30" rx="4" fill="#e7dbd3" stroke="#b9bcaf"/><text x="501" y="354" font-size="14" font-weight="400" fill="#25281f">标题层级</text><rect x="505" y="376" width="65" height="76" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="517" y="401" font-size="10.25" font-weight="400" fill="#25281f">视觉主体</text><path d="M489,454h98" stroke="#e61d2b" stroke-width="3"/><text x="489" y="484" font-size="13" font-weight="400" fill="#25281f">说明 / 行动信息</text><rect x="634" y="296" width="508" height="70" rx="4" fill="#d6d8cb" stroke="#b9bcaf"/><text x="646" y="321" font-size="19" font-weight="400" fill="#25281f">共同保留：主标题 / 品牌色 / 产品</text><text x="650" y="405" font-size="19" font-weight="400" fill="#25281f">根据阅读距离与画幅调整信息密度。</text><path d="M42,556h1116" stroke="#b5b6aa" stroke-width="3"/><text x="42" y="601" font-size="17" font-weight="500" fill="#e61d2b">01 / 核心识别</text><text x="268" y="601" font-size="17" font-weight="400" fill="#4e5447">以品牌红、白色飘带和产品主体连接四种触点。</text><text x="42" y="659" font-size="17" font-weight="500" fill="#e61d2b">02 / 尺寸调整</text><text x="268" y="659" font-size="17" font-weight="400" fill="#4e5447">横版强化标题与空间；竖版集中组织产品与活动信息。</text><text x="42" y="717" font-size="17" font-weight="500" fill="#e61d2b">03 / 信息层级</text><text x="268" y="717" font-size="17" font-weight="400" fill="#4e5447">主视觉吸引注意，时间地点与现场信息形成后续阅读。</text><rect x="42" y="767" width="28" height="12" fill="#e61d2b"/><rect x="77" y="767" width="28" height="12" fill="#f7f3e8"/><rect x="112" y="767" width="28" height="12" fill="#1b1b1b"/><text x="185" y="779" font-size="13" font-weight="400" fill="#707466">后补复盘图 · 非制作当时保存的原始草稿</text></g></svg>